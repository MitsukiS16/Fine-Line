<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fine Line</title>
<style>
  :root { --bg: #f6f1ea; --ink: #1c1a18; --muted: #7b736a; --line: #dcd3c7; --accent: #1c1a18; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 1160px; margin: 0 auto; padding: 16px 20px; }
  h1 { margin: 0; font: italic 400 32px/1.1 Georgia, serif; }
  header p { margin: 2px 0 12px; color: var(--muted); }

  #drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
          min-height: 340px; padding: 24px; border: 1.5px dashed #b9ae9f; border-radius: 12px;
          text-align: center; cursor: pointer; }
  #drop:hover, #drop:focus-visible, #drop.over { background: #fffaf3; border-color: var(--ink); }
  #drop strong { font-size: 20px; font-weight: 500; }
  #drop span { color: var(--muted); }

  #studio[hidden], #drop[hidden] { display: none; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  figure { position: relative; margin: 0; }
  figcaption { margin-bottom: 6px; color: var(--muted); font-size: 14px; }
  .frame { position: relative; display: flex; align-items: center; justify-content: center;
           height: clamp(220px, calc(100vh - 365px), 640px); overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .frame img, .frame svg { display: block; max-width: 100%; max-height: 100%; width: auto; height: 100%; object-fit: contain; }
  #paper { transition: background .15s; }
  #status { position: absolute; right: 10px; bottom: 10px; padding: 3px 10px; border-radius: 99px;
            background: var(--ink); color: #fff; font-size: 13px; visibility: hidden; white-space: pre-line; }
  #status.on { visibility: visible; }
  #status.big { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                padding: 16px; border-radius: 0; background: rgba(255, 255, 255, .9); color: var(--ink);
                font-size: 24px; font-weight: 500; line-height: 1.3; text-align: center; }
  #status.big::before { content: ""; width: 44px; height: 44px; margin-bottom: 16px; border-radius: 50%;
                        border: 3px solid var(--line); border-top-color: var(--ink); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #status.big::before { animation: none; } }

  .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 24px; margin-top: 12px; }
  label { display: block; font-size: 14px; }
  label output { float: right; color: var(--muted); }
  label small { display: block; color: var(--muted); font-size: 13px; }
  label.switch { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  input[type=range]:disabled { opacity: .4; }
  input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
  button { padding: 9px 16px; border: 1px solid var(--ink); border-radius: 8px; background: transparent;
           color: var(--ink); font: inherit; cursor: pointer; }
  button:hover { background: #ece4d9; }
  button.primary { background: var(--ink); color: #fff; }
  button.primary:hover { background: #3a3631; }
  button:disabled { opacity: .45; cursor: default; }
  .swatches { display: flex; align-items: center; gap: 8px; margin-right: auto; color: var(--muted); font-size: 14px; }
  .swatch { width: 28px; height: 28px; padding: 0; border: 1px solid #b9ae9f; border-radius: 50%; }
  .swatch[aria-pressed=true] { outline: 2px solid var(--ink); outline-offset: 2px; }
  #error { margin: 0; color: #a32a1c; }
  #error:not(:empty) { margin-bottom: 8px; }
  @media (max-width: 960px) {
    .controls { grid-template-columns: 1fr 1fr; }
    .frame { height: clamp(220px, calc(100vh - 470px), 640px); }
  }
  @media (max-width: 720px) {
    main { padding: 12px; }
    .panels, .controls { grid-template-columns: 1fr; }
    /* The drawing comes first on phones, with the original as a small reference. */
    .panels figure:last-child { order: -1; }
    #paper { height: 62vh; }
    #original { object-fit: contain; }
    .panels figure:first-child .frame { height: 26vh; }
    #drop { min-height: 50vh; }
    input[type=range] { height: 32px; }
    button { min-height: 46px; }
    .swatch { width: 42px; height: 42px; min-height: 0; }
    .swatches { width: 100%; }
    .actions button:not(.swatch) { flex: 1 1 100%; }
    label.switch input { width: 24px; height: 24px; }
    label.switch { margin-bottom: 8px; font-size: 16px; }
  }
  @media (hover: none) { #dropHint { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Fine Line</h1>
    <p>Turn a photo into a detailed line drawing.</p>
  </header>

  <div id="drop" role="button" tabindex="0">
    <strong>Choose an image</strong>
    <span id="dropHint">or drop it here, or paste it</span>
  </div>
  <p id="error" role="alert"></p>
  <input id="file" type="file" accept="image/*" hidden>

  <section id="studio" hidden>
    <div class="panels">
      <figure>
        <figcaption>Original</figcaption>
        <div class="frame"><img id="original" alt="Your original image"></div>
      </figure>
      <figure>
        <figcaption>Fine line</figcaption>
        <div class="frame" id="paper">
          <svg id="art" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fine line drawing"><path id="grid" fill="none" stroke="#b5ada2"/><path id="ink" fill="#141210"/></svg>
          <span id="status" role="status"></span>
        </div>
      </figure>
    </div>

    <div class="controls">
      <label>Detail <output id="detailOut"></output>
        <input id="detail" type="range" min="0" max="100" value="75">
        <small>More lines, or only the main ones</small>
      </label>
      <label>Clean up <output id="simplifyOut"></output>
        <input id="simplify" type="range" min="0" max="100" value="35">
        <small>Removes texture and tiny marks</small>
      </label>
      <label>Line thickness <output id="weightOut"></output>
        <input id="weight" type="range" min="0.5" max="5" step="0.1" value="1.6">
        <small>From hair-thin to bold</small>
      </label>
      <div>
        <label class="switch"><input id="gridOn" type="checkbox"> Grid</label>
        <label>Grid lines <output id="gridOut"></output>
          <input id="gridLines" type="range" min="2" max="60" value="12" disabled>
          <small>Squares across the image</small>
        </label>
      </div>
    </div>

    <div class="actions">
      <div class="swatches">Paper
        <button class="swatch" data-paper="#ffffff" style="background:#ffffff" aria-label="White paper" aria-pressed="true"></button>
        <button class="swatch" data-paper="#f0e3d4" style="background:#f0e3d4" aria-label="Cream paper" aria-pressed="false"></button>
      </div>
      <button id="another">New image</button>
      <button id="saveSvg">Download SVG</button>
      <button id="savePng" class="primary">Download PNG</button>
    </div>
  </section>
</main>

<script src="fineline.js"></script>
<script>
const MAX_SIDE = 1200, PNG_SCALE = 3;
const $ = id => document.getElementById(id);
const sliders = ['detail', 'simplify', 'weight'].map($);

// Built from source text so the worker also runs when index.html is opened
// straight from a folder, where loading a separate worker file is blocked.
const worker = new Worker(URL.createObjectURL(new Blob([`
  let cache = {};
  onmessage = ({ data }) => {
    if (data.gray) { cache = {}; self.gray = data.gray; self.lineMap = data.lineMap; }
    const { w, h, detail, simplify, id } = data;
    const strokes = (${traceFineLine.toString()})(self.gray, w, h, { detail, simplify, cache, lineMap: self.lineMap });
    postMessage({ id, strokes });
  };
`], { type: 'text/javascript' })));

let size = null, strokes = [], name = 'fine-line', paper = '#ffffff';
let latestId = 0, busy = false, queued = null, grayPending = null, lineMapPending = null;
let aiBusy = false, loadToken = 0;

// Going above 1024 costs far more time and memory without better drawings.
// Small screens use less because phones have little memory to spare.
const AI_SIDE = Math.min(screen.width, screen.height) < 600 ? 768 : 1024;
let aiWorker = null, aiJob = 0;

function loadAiBundle() {
  return new Promise((resolve, reject) => {
    if (aiWorker) return resolve();
    const s = document.createElement('script');
    s.src = 'ai-bundle.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.append(s);
  });
}

// The model and its engine are unpacked inside the worker, from memory, because
// a page opened straight from a folder is not allowed to fetch them as files.
function startAiWorker() {
  const body = `
    const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    let session = null;
    onmessage = async ({ data }) => {
      try {
        if (!session) {
          const wasm = URL.createObjectURL(new Blob([bytes(data.wasm)], { type: 'application/wasm' }));
          ort.env.wasm.numThreads = 1;
          ort.env.wasm.wasmPaths = { 'ort-wasm-simd.wasm': wasm };
          session = await ort.InferenceSession.create(bytes(data.model), { executionProviders: ['wasm'] });
        }
        const input = new ort.Tensor('float32', data.rgb, [1, 3, data.h, data.w]);
        const result = await session.run({ [session.inputNames[0]]: input });
        postMessage({ id: data.id, out: result[session.outputNames[0]].data });
      } catch (e) {
        postMessage({ id: data.id, failed: String(e) });
      }
    };
  `;
  return new Worker(URL.createObjectURL(new Blob([AI_BUNDLE.ort, ';\n', body], { type: 'text/javascript' })));
}

// Returns the model's drawing as darkness (0 = paper, 1 = ink), sized w by h.
async function aiLineMap(img, w, h) {
  await loadAiBundle();
  let engine = {};
  if (!aiWorker) {
    aiWorker = startAiWorker();
    engine = { wasm: AI_BUNDLE.wasm, model: AI_BUNDLE.model };
    window.AI_BUNDLE = null;   // the worker keeps its own copy; free this one
  }
  const fit = AI_SIDE / Math.max(w, h);
  const aw = Math.max(8, Math.round(w * fit / 8) * 8), ah = Math.max(8, Math.round(h * fit / 8) * 8);
  const canvas = document.createElement('canvas');
  canvas.width = aw; canvas.height = ah;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, aw, ah);
  ctx.drawImage(img, 0, 0, aw, ah);
  const rgba = ctx.getImageData(0, 0, aw, ah).data;
  const n = aw * ah, rgb = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    rgb[i] = rgba[4 * i] / 255;
    rgb[n + i] = rgba[4 * i + 1] / 255;
    rgb[2 * n + i] = rgba[4 * i + 2] / 255;
  }
  const id = ++aiJob;
  const out = await new Promise((resolve, reject) => {
    aiWorker.onmessage = ({ data }) => {
      if (data.id !== id) return;   // answer for an image that was since replaced
      data.failed ? reject(new Error(data.failed)) : resolve(data.out);
    };
    aiWorker.onerror = reject;
    aiWorker.postMessage({ id, rgb, w: aw, h: ah, ...engine }, [rgb.buffer]);
  });
  const map = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const px = Math.min(aw - 1.001, x * aw / w), py = Math.min(ah - 1.001, y * ah / h);
    const xi = px | 0, yi = py | 0, fx = px - xi, fy = py - yi, i = yi * aw + xi;
    const v = (out[i] * (1 - fx) + out[i + 1] * fx) * (1 - fy) + (out[i + aw] * (1 - fx) + out[i + aw + 1] * fx) * fy;
    map[y * w + x] = 1 - Math.min(1, Math.max(0, v));
  }
  return map;
}

function showStatus(on) {
  $('status').classList.toggle('on', on);
  const big = aiBusy || !strokes.length;
  $('status').classList.toggle('big', on && big);
  $('status').textContent = big ? 'The AI is drawing…\nThis can take up to 2 minutes' : 'Drawing…';
  for (const b of [$('savePng'), $('saveSvg')]) b.disabled = on;
}

function request() {
  if (aiBusy) return;   // the sliders are read again once the AI step finishes
  queued = { id: ++latestId, ...size, detail: +$('detail').value, simplify: +$('simplify').value };
  showStatus(true);
  pump();
}

function pump() {
  if (busy || !queued) return;
  const msg = queued;
  queued = null;
  busy = true;
  if (grayPending) {
    msg.gray = grayPending; msg.lineMap = lineMapPending;
    grayPending = lineMapPending = null;
  }
  worker.postMessage(msg);
}

worker.onmessage = ({ data }) => {
  busy = false;
  if (data.id === latestId && !aiBusy) {
    strokes = data.strokes;
    paint();
    showStatus(false);
  }
  pump();
};

worker.onerror = () => {
  busy = false;
  showStatus(false);
  $('error').textContent = 'Something went wrong while drawing this image. Try a different one.';
};

function strokeWidth() {
  return +$('weight').value * Math.max(size.w, size.h) / 1000;
}

function paint() {
  $('ink').setAttribute('d', strokesToPath(strokes, strokeWidth()));
}

// Square cells: the count sets the columns, rows follow from the image shape.
function paintGrid() {
  const { w, h } = size;
  const cell = w / +$('gridLines').value;
  let d = '';
  if ($('gridOn').checked) {
    for (let x = cell; x < w - 0.5; x += cell) d += `M${x.toFixed(1)} 0V${h}`;
    for (let y = cell; y < h - 0.5; y += cell) d += `M0 ${y.toFixed(1)}H${w}`;
  }
  $('grid').setAttribute('d', d);
  $('grid').setAttribute('stroke-width', gridWidth());
}

function gridWidth() {
  return 0.8 * Math.max(size.w, size.h) / 1000;
}

async function load(file) {
  $('error').textContent = '';
  if (!file || !file.type.startsWith('image/')) {
    $('error').textContent = 'That file is not an image. Please choose a JPG, PNG or WebP.';
    return;
  }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.src = url;
  try {
    await img.decode();
  } catch {
    URL.revokeObjectURL(url);
    $('error').textContent = 'This image could not be opened. Please try a JPG, PNG or WebP.';
    return;
  }
  // Small images are enlarged too: tracing at this size gives smoother curves.
  const fit = MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight);
  const w = Math.round(img.naturalWidth * fit), h = Math.round(img.naturalHeight * fit);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff';   // transparent PNGs trace against white
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  const rgba = ctx.getImageData(0, 0, w, h).data;
  const gray = new Float32Array(w * h);
  for (let i = 0; i < gray.length; i++) {
    gray[i] = (0.299 * rgba[4 * i] + 0.587 * rgba[4 * i + 1] + 0.114 * rgba[4 * i + 2]) / 255;
  }
  if ($('original').src) URL.revokeObjectURL($('original').src);
  $('original').src = url;
  size = { w, h };
  name = file.name ? file.name.replace(/\.[^.]*$/, '') + '-fine-line' : 'fine-line';
  strokes = [];
  $('art').setAttribute('viewBox', `0 0 ${w} ${h}`);
  paint();
  paintGrid();
  $('drop').hidden = true;
  $('studio').hidden = false;

  const token = ++loadToken;
  latestId++;       // a drawing still in progress belongs to the previous image
  queued = null;
  aiBusy = true;
  showStatus(true);
  let map = null;
  try {
    map = await aiLineMap(img, w, h);
  } catch (e) {
    console.error(e);
    $('error').textContent = 'The AI step could not run, so this drawing uses the basic tracer and may include the background.';
  }
  if (token !== loadToken) return;
  aiBusy = false;
  grayPending = gray;
  lineMapPending = map;
  request();
}

function svgText() {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size.w} ${size.h}" width="${size.w}" height="${size.h}">` +
    `<rect width="100%" height="100%" fill="${paper}"/>` +
    `<path d="${$('grid').getAttribute('d') || ''}" fill="none" stroke="#b5ada2" stroke-width="${gridWidth()}"/>` +
    `<path d="${$('ink').getAttribute('d')}" fill="#141210"/></svg>`;
}

// Named after the settings so each downloaded version stays easy to tell apart.
function versionLabel() {
  const grid = $('gridOn').checked ? `-grid${$('gridLines').value}` : '';
  return `detail${$('detail').value}-clean${$('simplify').value}-line${$('weight').value}${grid}`;
}

function download(blob, ext) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}-${versionLabel()}.${ext}`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function refreshLabels() {
  $('detailOut').textContent = $('detail').value;
  $('simplifyOut').textContent = $('simplify').value;
  $('weightOut').textContent = $('weight').value;
  $('gridOut').textContent = $('gridLines').value;
}

$('drop').onclick = () => $('file').click();
$('drop').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
$('file').onchange = () => { load($('file').files[0]); $('file').value = ''; };
$('another').onclick = () => $('file').click();

for (const type of ['dragover', 'dragenter']) addEventListener(type, e => { e.preventDefault(); $('drop').classList.add('over'); });
addEventListener('dragleave', () => $('drop').classList.remove('over'));
addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); load(e.dataTransfer.files[0]); });
addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) load(item.getAsFile());
});

for (const s of sliders) s.oninput = refreshLabels;
$('detail').onchange = $('simplify').onchange = request;
$('weight').oninput = () => { refreshLabels(); paint(); };
$('gridLines').oninput = () => { refreshLabels(); paintGrid(); };
$('gridOn').onchange = () => { $('gridLines').disabled = !$('gridOn').checked; paintGrid(); };

for (const b of document.querySelectorAll('.swatch')) b.onclick = () => {
  paper = b.dataset.paper;
  $('paper').style.background = paper;
  document.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', x === b));
};

$('saveSvg').onclick = () => download(new Blob([svgText()], { type: 'image/svg+xml' }), 'svg');
$('savePng').onclick = () => {
  const c = document.createElement('canvas');
  c.width = size.w * PNG_SCALE; c.height = size.h * PNG_SCALE;
  const ctx = c.getContext('2d');
  ctx.fillStyle = paper;
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.scale(PNG_SCALE, PNG_SCALE);
  ctx.strokeStyle = '#b5ada2';
  ctx.lineWidth = gridWidth();
  ctx.stroke(new Path2D($('grid').getAttribute('d') || ''));
  ctx.fillStyle = '#141210';
  ctx.fill(new Path2D($('ink').getAttribute('d')));
  c.toBlob(blob => download(blob, 'png'));
};

refreshLabels();
</script>
</body>
</html>
